name: AD8 Upstream

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Intentional failure (drives workflow_run gate as in the shipped example)
        run: |
          echo "AD8 upstream marker: intentionally failing so workflow_run.conclusion == 'failure'"
          exit 1
