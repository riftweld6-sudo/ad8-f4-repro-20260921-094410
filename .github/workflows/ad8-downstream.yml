name: AD8 Downstream (workflow_run)

# Mirror of examples/ci-failure-auto-fix.yml trigger shape:
# workflow_run + checkout of the PR head branch + claude-code-action.
on:
  workflow_run:
    workflows: ["AD8 Upstream"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  event-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump workflow_run event facts
        env:
          EVENT: ${{ toJson(github.event) }}
        run: |
          echo "$EVENT" | jq '{action: .action, wr: {name: .workflow_run.name, event: .workflow_run.event, conclusion: .workflow_run.conclusion, head_branch: .workflow_run.head_branch, actor: .workflow_run.actor.login, pull_requests: .workflow_run.pull_requests}}'

  ad8-automation-path:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head branch (as the shipped example does)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Run claude-code-action (real repo secret as the model key)
        id: claude
        uses: anthropics/claude-code-action@v1.0.226
        with:
          prompt: |
            AD8 benign probe. Reply with exactly: AD8-PONG. Do not use any tools.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.AD8_PROBE_SECRET }}
          classify_inline_comments: "false"
          show_full_output: "true"

      - name: AD8 capture check (terminal-effect evidence)
        if: always()
        run: |
          echo "===== AD8 capture files after action run ====="
          for f in /tmp/ad8_capture.log /tmp/ad8_hook.log /tmp/ad8_mcp.log /tmp/ad8_apikeyhelper.log; do
            echo "--- $f"
            cat "$f" 2>/dev/null || echo "(absent)"
          done
